<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Execution Engine</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container { max-width: 1400px; margin: 0 auto; }
    
    header { text-align: center; color: white; margin-bottom: 30px; }
    h1 { font-size: 2.5rem; margin-bottom: 10px; font-weight: 600; }
    .subtitle { font-size: 1.1rem; opacity: 0.9; }

    .main-content {
      display: grid;
      grid-template-columns: 350px 1fr 400px;
      gap: 20px;
      align-items: start;
    }

    .panel {
      background: white;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    }

    .form-group { margin-bottom: 18px; }
    
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #333;
    }

    select, input {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.3s;
    }

    select:focus, input:focus {
      outline: none;
      border-color: #667eea;
    }

    .token-pair {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      align-items: end;
    }

    .arrow {
      padding-bottom: 12px;
      color: #667eea;
      font-size: 1.2rem;
    }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }

    button:hover { transform: translateY(-2px); }
    button:active { transform: translateY(0); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .panel-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: #333;
    }

    .clear-btn {
      padding: 6px 14px;
      width: auto;
      font-size: 0.85rem;
      background: #f0f0f0;
      color: #666;
    }

    .order-card {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 12px;
      border-left: 4px solid #667eea;
    }

    .order-card.confirmed { border-left-color: #10b981; background: #f0fdf4; }
    .order-card.failed { border-left-color: #ef4444; background: #fef2f2; }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .order-id {
      font-family: monospace;
      font-size: 0.8rem;
      color: #666;
    }

    .order-info {
      font-size: 1rem;
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .status-pending { background: #fef3c7; color: #92400e; }
    .status-routing { background: #dbeafe; color: #1e40af; }
    .status-building { background: #e0e7ff; color: #4338ca; }
    .status-submitted { background: #fce7f3; color: #9f1239; }
    .status-confirmed { background: #d1fae5; color: #065f46; }
    .status-failed { background: #fee2e2; color: #991b1b; }

    .order-details {
      display: grid;
      gap: 6px;
      margin-top: 8px;
      font-size: 0.85rem;
      color: #666;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
    }

    .detail-label { font-weight: 500; }
    .detail-value { font-family: monospace; color: #333; }

    .logs-container {
      max-height: 70vh;
      overflow-y: auto;
    }

    .log-entry {
      background: #f8f9fa;
      border-left: 3px solid #667eea;
      padding: 12px;
      margin-bottom: 8px;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    .log-entry.routing { border-left-color: #3b82f6; }
    .log-entry.building { border-left-color: #8b5cf6; }
    .log-entry.submitted { border-left-color: #ec4899; }
    .log-entry.confirmed { border-left-color: #10b981; }
    .log-entry.failed { border-left-color: #ef4444; }

    .log-time {
      font-size: 0.75rem;
      color: #999;
      margin-bottom: 4px;
    }

    .log-message {
      color: #333;
      line-height: 1.5;
    }

    .log-highlight {
      font-weight: 600;
      color: #667eea;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #999;
    }

    .orders-panel {
      max-height: 70vh;
      overflow-y: auto;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #f3f3f3;
      border-top: 2px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-left: 8px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @media (max-width: 1200px) {
      .main-content {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>⚡ Order Execution Engine</h1>
      <p class="subtitle">DEX Routing: Raydium vs Meteora | 10 Concurrent Workers</p>
    </header>

    <div class="main-content">
      <div class="panel">
        <h2 style="margin-bottom: 20px; color: #333;">New Order</h2>
        
        <form id="orderForm">
          <div class="form-group">
            <label>Order Type</label>
            <select id="orderType">
              <option value="market">Market Order</option>
            </select>
          </div>

          <div class="form-group">
            <label>Token Pair</label>
            <div class="token-pair">
              <div>
                <select id="tokenIn">
                  <option value="SOL">SOL</option>
                  <option value="USDC">USDC</option>
                  <option value="USDT">USDT</option>
                </select>
              </div>
              <div class="arrow">→</div>
              <div>
                <select id="tokenOut">
                  <option value="USDC">USDC</option>
                  <option value="SOL">SOL</option>
                  <option value="USDT">USDT</option>
                </select>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label>Amount In</label>
            <input type="number" id="amountIn" placeholder="Enter amount" min="1" step="0.01" required>
          </div>

          <div class="form-group">
            <label>Number of Orders</label>
            <input type="number" id="numOrders" placeholder="1-10" min="1" max="10" value="1" required>
          </div>

          <button type="submit" id="submitBtn">Execute Order(s)</button>
        </form>
      </div>

      <div class="panel">
        <div class="panel-header">
          <h2 class="panel-title">Execution Logs</h2>
          <button class="clear-btn" onclick="clearLogs()">Clear</button>
        </div>
        
        <div class="logs-container" id="logsContainer">
          <div class="empty-state">
            <div style="font-size: 2rem; margin-bottom: 10px;">📋</div>
            <p>Execution logs will appear here</p>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <h2 class="panel-title">Active Orders</h2>
          <button class="clear-btn" onclick="clearOrders()">Clear</button>
        </div>
        
        <div class="orders-panel" id="ordersContainer">
          <div class="empty-state">
            <div style="font-size: 2rem; margin-bottom: 10px;">📊</div>
            <p>No orders yet</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const RENDER_API_URL = 'https://eterna-project.onrender.com';
    const ordersMap = new Map();
    let logCounter = 0;

    function addLog(message, type = 'info') {
      const container = document.getElementById('logsContainer');
      
      if (container.querySelector('.empty-state')) {
        container.innerHTML = '';
      }

      const logEntry = document.createElement('div');
      logEntry.className = `log-entry ${type}`;
      
      const now = new Date();
      const timeStr = now.toLocaleTimeString();
      
      logEntry.innerHTML = `
        <div class="log-time">${timeStr}</div>
        <div class="log-message">${message}</div>
      `;

      container.appendChild(logEntry);
      logCounter++;

      if (logCounter > 50) {
        const entries = container.querySelectorAll('.log-entry');
        if (entries.length > 50) {
          entries[0].remove();
        }
      }

      container.scrollTop = container.scrollHeight;
    }

    function clearLogs() {
      const container = document.getElementById('logsContainer');
      container.innerHTML = `
        <div class="empty-state">
          <div style="font-size: 2rem; margin-bottom: 10px;">📋</div>
          <p>Execution logs will appear here</p>
        </div>
      `;
      logCounter = 0;
    }

    document.getElementById('orderForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const tokenIn = document.getElementById('tokenIn').value;
      const tokenOut = document.getElementById('tokenOut').value;
      const amountIn = parseFloat(document.getElementById('amountIn').value);
      const numOrders = parseInt(document.getElementById('numOrders').value);

      if (tokenIn === tokenOut) {
        alert('Token In and Token Out must be different');
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerHTML = 'Processing<span class="spinner"></span>';

      addLog(`🚀 <span class="log-highlight">Submitting ${numOrders} order(s):</span> ${amountIn} ${tokenIn} → ${tokenOut}`, 'info');

      const orderPromises = [];

      for (let i = 0; i < numOrders; i++) {
        const orderNum = i + 1;
        orderPromises.push(executeOrder(tokenIn, tokenOut, amountIn, orderNum));
        await new Promise(resolve => setTimeout(resolve, 100));
      }

      Promise.all(orderPromises).finally(() => {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Execute Order(s)';
      });
    });

    function executeOrder(tokenIn, tokenOut, amountIn, orderNum) {
      return new Promise((resolve, reject) => {
        const orderData = {
          orderType: 'market',
          tokenIn,
          tokenOut,
          amountIn
        };

        try {
          const wsUrl = RENDER_API_URL.replace('https://', 'wss://').replace('http://', 'ws://');
          const ws = new WebSocket(`${wsUrl}/api/orders/execute`);

          ws.onopen = () => {
            ws.send(JSON.stringify(orderData));
            addLog(`✓ Order #${orderNum} WebSocket connected`, 'info');
          };

          ws.onmessage = (event) => {
            const update = JSON.parse(event.data);
            
            if (update.error) {
              addLog(`❌ Order #${orderNum} Error: ${update.error}`, 'failed');
              return;
            }

            updateOrderUI(update);

            switch(update.status) {
              case 'pending':
                addLog(`⏳ Order #${orderNum} queued for processing`, 'pending');
                break;
              
              case 'routing':
                addLog(`🔍 Order #${orderNum} comparing Raydium vs Meteora quotes...`, 'routing');
                break;
              
              case 'building':
                addLog(`⚡ Order #${orderNum} <span class="log-highlight">${update.dexUsed.toUpperCase()}</span> has better price! Building transaction...`, 'building');
                break;
              
              case 'submitted':
                addLog(`📤 Order #${orderNum} transaction submitted to ${update.dexUsed.toUpperCase()}`, 'submitted');
                break;
              
              case 'confirmed':
                addLog(`✅ Order #${orderNum} <span class="log-highlight">CONFIRMED!</span> Price: ${update.executedPrice.toFixed(4)} | TX: ${update.txHash.substring(0, 12)}...`, 'confirmed');
                break;
              
              case 'failed':
                addLog(`❌ Order #${orderNum} failed: ${update.error}`, 'failed');
                break;
            }

            if (update.status === 'confirmed' || update.status === 'failed') {
              ws.close();
              resolve(update);
            }
          };

          ws.onerror = (error) => {
            addLog(`❌ Order #${orderNum} connection error`, 'failed');
            reject(error);
          };

          ws.onclose = () => {
            resolve();
          };

        } catch (error) {
          addLog(`❌ Order #${orderNum} failed to connect: ${error.message}`, 'failed');
          reject(error);
        }
      });
    }

    function updateOrderUI(update) {
      const container = document.getElementById('ordersContainer');
      
      if (container.querySelector('.empty-state')) {
        container.innerHTML = '';
      }

      if (!ordersMap.has(update.orderId)) {
        const orderCard = createOrderCard(update);
        container.insertBefore(orderCard, container.firstChild);
        ordersMap.set(update.orderId, orderCard);
      } else {
        const orderCard = ordersMap.get(update.orderId);
        updateOrderCard(orderCard, update);
      }
    }

    function createOrderCard(update) {
      const card = document.createElement('div');
      card.className = 'order-card';
      card.id = `order-${update.orderId}`;
      
      const tokenIn = document.getElementById('tokenIn').value;
      const tokenOut = document.getElementById('tokenOut').value;
      const amountIn = document.getElementById('amountIn').value;

      card.innerHTML = `
        <div class="order-header">
          <span class="order-id">${update.orderId}</span>
          <span class="status-badge status-${update.status}">${update.status}</span>
        </div>
        <div class="order-info">${amountIn} ${tokenIn} → ${tokenOut}</div>
        <div class="order-details"></div>
      `;

      return card;
    }

    function updateOrderCard(card, update) {
      const statusBadge = card.querySelector('.status-badge');
      statusBadge.className = `status-badge status-${update.status}`;
      statusBadge.textContent = update.status;

      if (update.status === 'confirmed' || update.status === 'failed') {
        card.className = `order-card ${update.status}`;
      }

      const detailsDiv = card.querySelector('.order-details');
      let detailsHTML = '';

      if (update.dexUsed) {
        detailsHTML += `
          <div class="detail-row">
            <span class="detail-label">DEX:</span>
            <span class="detail-value">${update.dexUsed.toUpperCase()}</span>
          </div>
        `;
      }

      if (update.executedPrice) {
        detailsHTML += `
          <div class="detail-row">
            <span class="detail-label">Price:</span>
            <span class="detail-value">${update.executedPrice.toFixed(4)}</span>
          </div>
        `;
      }

      if (update.txHash) {
        detailsHTML += `
          <div class="detail-row">
            <span class="detail-label">TX:</span>
            <span class="detail-value">${update.txHash.substring(0, 16)}...</span>
          </div>
        `;
      }

      if (update.error) {
        detailsHTML += `
          <div class="detail-row">
            <span class="detail-label">Error:</span>
            <span class="detail-value" style="color: #ef4444;">${update.error}</span>
          </div>
        `;
      }

      detailsDiv.innerHTML = detailsHTML;
    }

    function clearOrders() {
      const container = document.getElementById('ordersContainer');
      container.innerHTML = `
        <div class="empty-state">
          <div style="font-size: 2rem; margin-bottom: 10px;">📊</div>
          <p>No orders yet</p>
        </div>
      `;
      ordersMap.clear();
    }
  </script>
</body>
</html>
